description: Desarrollé la tienda ecommerce DTC de GRIZZLY, marca colombiana de chanclas premium fabricadas en Ibagué, con catálogo por colecciones, checkout de invitado sin registro y seguimiento por token, pagos con Wompi y contraentrega por WhatsApp, reserva de stock con expiración automática, cotización y guías de envío nacional, correos transaccionales y panel interno de gestión de pedidos, utilizando Next.js, React, TypeScript, Supabase y Tailwind CSS sobre una arquitectura server-first con RLS, Server Actions y máquina de estados en base de datos.
